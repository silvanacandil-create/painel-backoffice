name: Reconciliar cards Pipefy (simulacao)
on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sincronizacao-pipefy-supabase
  cancel-in-progress: false
jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Comparar IDs sem modificar o banco
        env:
          PIPEFY_TOKEN: ${{ secrets.PIPEFY_TOKEN }}
          PIPEFY_PIPE_ID: ${{ secrets.PIPEFY_PIPE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python reconciliacao_pipefy_semanal.py
