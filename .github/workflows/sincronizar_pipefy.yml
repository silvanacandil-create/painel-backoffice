name: Sincronizar Pipefy com Supabase
run-name: Sincronizar Pipefy ${{ inputs.request_id || github.event_name }}

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Identificador da solicitacao do painel'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sincronizacao-pipefy-supabase
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests
      - name: Sincronizar cards atualizados
        env:
          PIPEFY_TOKEN: ${{ secrets.PIPEFY_TOKEN }}
          PIPEFY_PIPE_ID: ${{ secrets.PIPEFY_PIPE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sincronizacao_pipefy_supabase.py
